title: Ingeniero de software e inteligencia artificial
summary: Ingeniero de software e inteligencia artificial con experiencia en
  Cleverdist, CERN y Merkle EMEA. Mi trayectoria incluye desarrollo full-stack
  en distintos entornos de trabajo, investigación en procesamiento del lenguaje
  natural basado en inteligencia artificial y preparación de datos para entrenar
  modelos. Estudié ingeniería del software en la Universidad de Oviedo y cursé
  un máster en inteligencia artificial en la VIU. Esta formación, junto con mi
  experiencia profesional, me ha preparado para adaptarme a una amplia variedad
  de retos.
