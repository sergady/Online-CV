title: Ingénieur logiciel et intelligence artificielle
summary: Ingénieur logiciel et intelligence artificielle, avec une expérience
  chez Cleverdist, au CERN et chez Merkle EMEA. Mon parcours comprend le
  développement full-stack dans différents environnements de travail, la recherche
  en traitement du langage naturel fondé sur l’intelligence artificielle et la
  préparation de données pour entraîner des modèles. J’ai étudié le génie logiciel
  à l’Université d’Oviedo et suivi un master en intelligence artificielle à la VIU.
  Cette formation, associée à mon expérience professionnelle, m’a préparé à
  m’adapter à une grande variété de défis.
