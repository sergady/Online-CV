experience:
  cleverdist:
    role: Développeur logiciel
    achievements:
      - Mission de conseil pour Skyguide visant à créer un nouveau projet de supervision du contrôle du trafic aérien.
      - Développement de bout en bout d’un système complet de supervision.
      - Prise en compte des besoins du client et support de l’application développée.
  cern:
    role: Développeur logiciel et de frameworks
    achievements:
      - Développement d’une bibliothèque propriétaire pour le contrôle industriel.
      - Recueil des besoins d’experts en physique et d’autres disciplines scientifiques pour leurs projets.
      - Découverte des expériences et projets de pointe du CERN.
  merkle:
    role: Analyste-programmeur
    achievements:
      - Développement d’applications web pour SKY UK, côté frontend et backend.
      - Utilisation de Spring, React, jBPM, Java, JavaScript et SQL.
      - Collaboration avec les méthodes Agile et Scrum.
  wroclaw:
    role: Étudiant chercheur
    achievements:
      - Recherche en traitement du langage naturel fondé sur l’intelligence
        artificielle.
      - Collecte et nettoyage de données pour l’entraînement de modèles
        d’intelligence artificielle.
      - Implémentation de méthodes d’analyse de texte pour la recherche en
        traitement du langage naturel.
degrees:
  viu-ai:
    description: Études en intelligence artificielle à la VIU, d’octobre 2024 à
      juillet 2025. J’y ai appris les principes fondamentaux du fonctionnement des
      grands modèles de langage (LLM), la théorie de la décision et d’autres
      compétences liées à l’intelligence artificielle.
  oviedo:
    description: Études en génie logiciel, avec un échange Erasmus en Pologne
      (2019–2020), un projet collaboratif d’intelligence artificielle pour un
      jeu et un projet de fin d’études sur l’intelligence artificielle et le
      traitement du langage naturel.
